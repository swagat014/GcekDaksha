# Netlify Configuration for Daksha Championship
# Optimized for performance, security, and SEO

[build]
# Build command
command = "npm run build"
# Build output directory
publish = "dist"
# Node version
node_version = "20"

# Environment variables
[build.environment]
NODE_OPTIONS = "--max-old-space-size=4096"

# Headers for performance optimization
[[headers]]
for = "/*"
[headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  X-XSS-Protection = "1; mode=block"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache control for static assets
[[headers]]
for = "/js/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/css/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
  
[[headers]]
for = "/fonts/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Cache control for HTML (no caching for dynamic content)
[[headers]]
for = "/*.html"
[headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate, s-maxage=3600"

# Cache control for root index
[[headers]]
for = "/index.html"
[headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"

# Security headers for all pages
[[headers]]
for = "/*"
[headers.values]
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  
# Enable compression for specific file types
[[headers]]
for = "/**"
[headers.values]
  Content-Encoding = "gzip"

# Redirects for old URLs (if any migration needed)
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

# Redirect all non-matching routes to index for SPA
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Optimized Netlify functions
[functions]
node_bundler = "esbuild"

# Analytics and monitoring (optional)
[analytics]
enabled = true

# Build settings
[build]
functions = "functions"
ignore = "git diff --quiet HEAD^ HEAD -- ."
